name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore Backend/Service/Backend.csproj

      - name: Build
        run: dotnet build Backend/Service/Backend.csproj --no-restore --configuration Release

      - name: Restore tests
        run: dotnet restore Backend/Test/Test.csproj

      - name: Test
        run: dotnet test Backend/Test/Test.csproj --no-restore --verbosity normal
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: false
